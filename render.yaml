services:
  - type: web
    name: nakaru-san
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_URL
        sync: false
      - key: VITE_INSTAGRAM_AUTH_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
