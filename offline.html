<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nakaru-San Offline</title>
    <meta name="theme-color" content="#7c3cff" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        color: #f8fafc;
        background:
          radial-gradient(circle at top left, rgba(124, 60, 255, 0.28), transparent 34rem),
          radial-gradient(circle at top right, rgba(250, 204, 21, 0.12), transparent 30rem),
          linear-gradient(135deg, #050509 0%, #11111d 52%, #070713 100%);
      }

      main {
        width: min(560px, 100%);
        padding: 2rem;
        border: 1px solid rgba(250, 204, 21, 0.24);
        border-radius: 8px;
        background: rgba(15, 15, 25, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      img {
        width: 84px;
        height: 84px;
        object-fit: contain;
        border-radius: 18px;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.8rem;
        font-size: clamp(2rem, 8vw, 3.4rem);
      }

      p {
        margin: 0;
        color: #d7dbea;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/icon-192.png" alt="" />
      <h1>Nakaru-San</h1>
      <p>You are offline right now. Reconnect to the internet to load profiles, messages, live rooms, calls, and the newest community posts.</p>
    </main>
  </body>
</html>
