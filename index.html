<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nakaru-San</title>
    <meta name="description" content="Nakaru-San anime and gaming social community." />
    <meta name="theme-color" content="#7c3cff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nakaru-San" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <style>:root {
  color-scheme: dark;
  --bg: #070812;
  --panel: rgba(20, 20, 34, 0.94);
  --panel-strong: #161426;
  --line: rgba(255, 255, 255, 0.14);
  --text: #f8fafc;
  --muted: #bdc4d7;
  --purple: #7c3cff;
  --purple-strong: #5b21b6;
  --blue: #38bdf8;
  --gold: #facc15;
  --rose: #f472b6;
  --green: #34d399;
  --danger: #fb7185;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  min-height: 100%;
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(124, 60, 255, 0.34), transparent 34rem),
    radial-gradient(circle at top right, rgba(250, 204, 21, 0.16), transparent 30rem),
    radial-gradient(circle at 54% 6%, rgba(56, 189, 248, 0.13), transparent 32rem),
    linear-gradient(135deg, #070812 0%, #171529 52%, #090a17 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(7, 8, 18, 0.32), rgba(7, 8, 18, 0.68)),
    radial-gradient(circle at 50% 0%, rgba(124, 60, 255, 0.24), transparent 30rem);
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.62;
}

.page-anchor,
#about {
  scroll-margin-top: 96px;
}

input,
textarea {
  width: 100%;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.9rem 1rem;
  outline: none;
}

textarea {
  resize: vertical;
}

input:focus,
textarea:focus {
  border-color: rgba(56, 189, 248, 0.75);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
}

label {
  display: grid;
  gap: 0.45rem;
  color: #d7dbea;
  font-weight: 700;
}

.app-shell {
  position: relative;
  min-height: 100vh;
  padding: 6.25rem 1.25rem 2rem;
}

.app-shell::before {
  content: "";
  position: fixed;
  inset: -14vh -14vw;
  z-index: 0;
  pointer-events: none;
  opacity: 0.58;
  background:
    radial-gradient(circle at 8% 12%, rgba(125, 211, 252, 0.9) 0 1px, transparent 2px),
    radial-gradient(circle at 18% 72%, rgba(59, 130, 246, 0.85) 0 1.2px, transparent 2.4px),
    radial-gradient(circle at 31% 28%, rgba(186, 230, 253, 0.78) 0 1px, transparent 2px),
    radial-gradient(circle at 45% 82%, rgba(56, 189, 248, 0.75) 0 1px, transparent 2px),
    radial-gradient(circle at 62% 18%, rgba(147, 197, 253, 0.82) 0 1.1px, transparent 2.2px),
    radial-gradient(circle at 73% 54%, rgba(56, 189, 248, 0.72) 0 1px, transparent 2px),
    radial-gradient(circle at 88% 24%, rgba(191, 219, 254, 0.78) 0 1.2px, transparent 2.5px),
    radial-gradient(circle at 94% 78%, rgba(96, 165, 250, 0.8) 0 1px, transparent 2.1px);
  background-size: 260px 260px, 340px 340px, 420px 420px, 310px 310px, 380px 380px, 290px 290px, 450px 450px, 330px 330px;
  transform-origin: 50% 50%;
  animation: starOrbit 64s linear infinite;
}

.dragon-background {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  opacity: 0.86;
  mix-blend-mode: screen;
  filter: saturate(1.22) contrast(1.08);
}

.kanji-rain {
  position: fixed;
  inset: -18vh 0 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: 0.96;
  mix-blend-mode: screen;
}

.kanji-rain span {
  position: absolute;
  left: var(--x);
  top: -18vh;
  color: rgba(216, 180, 254, 0.72);
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
  font-size: 5.75rem;
  font-weight: 900;
  letter-spacing: 0;
  text-rendering: geometricPrecision;
  text-shadow:
    0 0 1px rgba(255, 255, 255, 0.95),
    0 0 14px rgba(124, 60, 255, 0.86),
    0 0 32px rgba(168, 85, 247, 0.66),
    0 0 52px rgba(250, 204, 21, 0.2);
  filter: drop-shadow(0 0 18px rgba(124, 60, 255, 0.64));
  animation: kanjiFall var(--duration) linear infinite;
  animation-delay: var(--delay);
}

.kanji-rain span.gold {
  color: rgba(253, 224, 71, 0.86);
  text-shadow:
    0 0 1px rgba(255, 255, 255, 0.9),
    0 0 14px rgba(250, 204, 21, 0.9),
    0 0 34px rgba(180, 83, 9, 0.5),
    0 0 58px rgba(56, 189, 248, 0.16);
  filter: drop-shadow(0 0 22px rgba(250, 204, 21, 0.62));
}

.kanji-rain span.purple {
  color: rgba(216, 180, 254, 0.78);
}

.kanji-rain span.word {
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  font-size: 3rem;
  letter-spacing: 0;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-weight: 950;
}

.kanji-rain span.word.gold {
  color: rgba(253, 224, 71, 0.92);
}

.kanji-rain span.word.purple {
  color: rgba(216, 180, 254, 0.88);
}

@keyframes kanjiFall {
  0% {
    transform: translate3d(-12px, -18vh, 0) rotate(-10deg) scale(0.88);
    opacity: 0;
  }
  12% {
    opacity: 0.9;
  }
  52% {
    opacity: 0.7;
    text-shadow:
      0 0 1px rgba(255, 255, 255, 0.92),
      0 0 18px rgba(216, 180, 254, 0.88),
      0 0 46px rgba(124, 60, 255, 0.58);
  }
  100% {
    transform: translate3d(16px, 126vh, 0) rotate(12deg) scale(1.04);
    opacity: 0;
  }
}

@keyframes starOrbit {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    background-position: 0 0, 40px 20px, 80px 120px, 20px 80px, 150px 30px, 90px 50px, 130px 170px, 210px 60px;
  }
  50% {
    transform: translate3d(-34px, 42px, 0) rotate(1.6deg) scale(1.035);
    background-position: 120px 170px, 180px 120px, 220px 240px, 150px 220px, 260px 160px, 210px 190px, 280px 320px, 350px 210px;
  }
  100% {
    transform: translate3d(-68px, 84px, 0) rotate(3.2deg) scale(1);
    background-position: 260px 340px, 340px 240px, 420px 420px, 310px 310px, 380px 290px, 290px 290px, 450px 450px, 330px 330px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .dragon-background {
    opacity: 0.48;
  }

  .kanji-rain span {
    animation-duration: 36s;
  }
}

.topbar {
  position: fixed;
  inset: 0 0 auto;
  z-index: 30;
  display: grid;
  grid-template-columns: auto minmax(260px, 1fr) minmax(280px, 460px) auto;
  align-items: center;
  gap: 0.75rem;
  min-height: 76px;
  padding: 0.7rem 1rem;
  background: rgba(9, 10, 22, 0.9);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}

.merch-banner,
.version-badge,
.demo-banner,
.page-anchor,
.page-grid,
.content-layout,
.inbox-layout {
  position: relative;
  z-index: 1;
}

.merch-banner {
  display: flex;
  align-items: end;
  width: min(1180px, 100%);
  aspect-ratio: 16 / 5;
  min-height: 150px;
  max-height: 300px;
  margin: 0 auto 0.9rem;
  padding: 0.8rem;
  overflow: hidden;
  border: 1px solid rgba(250, 204, 21, 0.24);
  border-radius: 8px;
  background:
    linear-gradient(110deg, rgba(5, 5, 9, 0.98), rgba(28, 15, 56, 0.88) 58%, rgba(5, 5, 9, 0.98)),
    radial-gradient(circle at 80% 30%, rgba(124, 60, 255, 0.38), transparent 16rem);
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.32);
}

.merch-banner::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0.18), transparent 34%, rgba(0, 0, 0, 0.12)),
    linear-gradient(180deg, transparent 70%, rgba(0, 0, 0, 0.34)),
    linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent),
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 16px);
  opacity: 0.5;
}

.merch-copy,
.merch-image {
  position: relative;
  z-index: 1;
}

.merch-copy {
  max-width: min(620px, 100%);
  display: grid;
  gap: 0.35rem;
  padding: 0.9rem 1rem;
  border: 1px solid rgba(250, 204, 21, 0.28);
  border-radius: 8px;
  background: rgba(5, 5, 9, 0.72);
  box-shadow: 0 20px 42px rgba(0, 0, 0, 0.34);
  backdrop-filter: blur(10px);
}

.merch-banner.has-merch-image .merch-copy {
  display: none;
}

.merch-copy strong {
  font-size: clamp(1.35rem, 3vw, 2.35rem);
  line-height: 1;
}

.merch-copy small {
  max-width: 660px;
  color: #d9dcec;
  font-size: 0.94rem;
  line-height: 1.5;
}

.merch-image {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  min-height: 100%;
}

.merch-image img {
  width: 100%;
  height: 100%;
  max-height: none;
  object-fit: cover;
  object-position: center;
  opacity: 1;
  filter: saturate(1.04) contrast(1.06) drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
}

.hoodie-fallback {
  display: none;
  align-items: end;
  justify-content: center;
  gap: 0.72rem;
  width: 100%;
  min-height: 100%;
}

.merch-image.use-fallback .hoodie-fallback {
  display: flex;
}

.hoodie-card {
  position: relative;
  display: grid;
  place-items: center;
  width: 82px;
  height: 94px;
  color: var(--gold);
  border: 1px solid rgba(250, 204, 21, 0.35);
  border-radius: 18px 18px 8px 8px;
  background:
    radial-gradient(circle at 50% 18%, rgba(124, 60, 255, 0.45), transparent 1.8rem),
    linear-gradient(145deg, #09090f, #19112d 58%, #07070c);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 18px 28px rgba(0, 0, 0, 0.36),
    0 0 24px rgba(124, 60, 255, 0.2);
}

.hoodie-card::before,
.hoodie-card::after {
  content: "";
  position: absolute;
  top: 24px;
  width: 28px;
  height: 62px;
  border: 1px solid rgba(250, 204, 21, 0.22);
  background: linear-gradient(180deg, #08080d, #141123);
}

.hoodie-card::before {
  left: -22px;
  transform: rotate(13deg);
  border-radius: 16px 4px 12px 16px;
}

.hoodie-card::after {
  right: -22px;
  transform: rotate(-13deg);
  border-radius: 4px 16px 16px 12px;
}

.hoodie-card b {
  position: relative;
  z-index: 1;
  font-size: 1.25rem;
  text-shadow: 0 0 14px rgba(250, 204, 21, 0.36);
}

.hoodie-two {
  width: 96px;
  height: 112px;
  transform: translateY(-8px);
}

.hoodie-three {
  transform: translateY(5px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.72rem;
  min-width: max-content;
  color: var(--text);
  background: transparent;
  font-weight: 950;
  font-size: 1.05rem;
  letter-spacing: 0;
}

.brand img {
  width: 46px;
  height: 46px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid rgba(250, 204, 21, 0.45);
}

.sidebar-scrim {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
  background: rgba(0, 0, 0, 0);
  transition: background 180ms ease;
}

.sidebar-scrim.open {
  pointer-events: auto;
  background: rgba(0, 0, 0, 0.58);
}

.logo-sidebar {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 50;
  width: min(390px, 88vw);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 1rem;
  padding: 1rem;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(250, 204, 21, 0.16), transparent 32%),
    radial-gradient(circle at 20% 38%, rgba(124, 60, 255, 0.22), transparent 34%),
    rgba(8, 8, 15, 0.98);
  border-right: 1px solid rgba(250, 204, 21, 0.28);
  box-shadow: 28px 0 80px rgba(0, 0, 0, 0.48);
  transform: translateX(-105%);
  transition: transform 220ms ease;
}

.logo-sidebar.open {
  transform: translateX(0);
}

.sidebar-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 0.8rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}

.sidebar-head img {
  width: 54px;
  height: 54px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid rgba(250, 204, 21, 0.42);
}

.sidebar-head strong {
  display: block;
  font-size: 1.1rem;
}

.sidebar-close {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  color: var(--text);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  font-size: 1.45rem;
}

.logo-sidebar p {
  margin: 0;
  color: #d6daea;
  line-height: 1.65;
}

.sidebar-links {
  display: grid;
  gap: 0.55rem;
  align-content: start;
  overflow: auto;
}

.sidebar-links button {
  justify-content: flex-start;
  min-height: 42px;
  padding: 0.7rem 0.85rem;
  color: var(--text);
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-weight: 850;
}

.sidebar-links button.active,
.sidebar-links button:hover {
  border-color: rgba(250, 204, 21, 0.42);
  background: linear-gradient(135deg, rgba(124, 60, 255, 0.66), rgba(250, 204, 21, 0.12));
}

.sidebar-cta {
  display: grid;
  gap: 0.7rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
}

.sidebar-cta .primary-action {
  width: 100%;
}

.install-hint {
  display: block;
  color: #d7dbea;
  line-height: 1.45;
}

.notification-bell {
  position: relative;
  min-height: 42px;
  padding: 0.62rem 0.8rem;
  color: var(--text);
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-weight: 850;
}

.notification-bell.has-unread {
  border-color: rgba(250, 204, 21, 0.5);
  box-shadow: 0 0 24px rgba(124, 60, 255, 0.22);
}

.notification-bell b {
  position: absolute;
  top: -0.45rem;
  right: -0.45rem;
  min-width: 1.35rem;
  height: 1.35rem;
  display: grid;
  place-items: center;
  padding: 0 0.25rem;
  color: #050509;
  background: var(--gold);
  border-radius: 999px;
  font-size: 0.72rem;
}

.notification-tray {
  position: fixed;
  top: 86px;
  right: 1rem;
  z-index: 40;
  width: min(420px, calc(100vw - 2rem));
  max-height: calc(100vh - 110px);
  overflow: auto;
  padding: 1rem;
  border: 1px solid rgba(250, 204, 21, 0.24);
  border-radius: 8px;
  background: rgba(15, 15, 25, 0.96);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.notification-list {
  display: grid;
  gap: 0.65rem;
}

.notification-item {
  display: grid;
  gap: 0.2rem;
  width: 100%;
  text-align: left;
  padding: 0.8rem;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
}

.notification-item span,
.notification-item small {
  color: var(--muted);
}

.topbar nav {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  overflow-x: auto;
  scrollbar-width: thin;
}

.top-search {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) auto auto auto;
  align-items: center;
  gap: 0.35rem;
  min-width: 0;
}

.top-search input {
  min-width: 0;
  height: 40px;
  padding: 0 0.85rem;
  color: var(--text);
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.top-search button {
  min-height: 40px;
  padding: 0.55rem 0.72rem;
  color: #d8dcee;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-weight: 850;
  white-space: nowrap;
}

.top-search button:hover {
  border-color: rgba(250, 204, 21, 0.38);
  background: rgba(124, 60, 255, 0.28);
}

.topbar nav button,
.thread,
.room-tabs button,
.segmented button,
.oauth-row button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 40px;
  color: #d8dcee;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.58rem 0.78rem;
  white-space: nowrap;
}

.topbar nav button.active,
.room-tabs button.active,
.segmented button.active,
.thread.active {
  color: #fff;
  border-color: rgba(250, 204, 21, 0.38);
  background: linear-gradient(135deg, rgba(124, 60, 255, 0.88), rgba(36, 99, 235, 0.55));
}

.account-tools {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.avatar-button {
  display: inline-grid;
  place-items: center;
  background: transparent;
  border: 0;
  padding: 0;
}

.icon-only {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.primary-action,
.ghost-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 42px;
  border-radius: 8px;
  padding: 0.72rem 1rem;
  font-weight: 900;
  white-space: nowrap;
}

.primary-action {
  color: #09090f;
  background: linear-gradient(135deg, var(--gold), #fde68a);
  box-shadow: 0 16px 36px rgba(250, 204, 21, 0.16);
}

.ghost-action {
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
}

.version-badge,
.demo-banner {
  max-width: 1180px;
  margin: 0 auto 1rem;
  color: var(--muted);
  font-size: 0.82rem;
}

.demo-banner {
  padding: 0.75rem 1rem;
  border: 1px solid rgba(250, 204, 21, 0.28);
  border-radius: 8px;
  background: rgba(250, 204, 21, 0.08);
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.055);
}

.page-grid,
.content-layout,
.inbox-layout {
  display: grid;
  gap: 1rem;
  width: min(1180px, 100%);
  margin: 0 auto;
}

.content-layout {
  grid-template-columns: minmax(0, 1fr) 340px;
  align-items: start;
}

.inbox-layout {
  grid-template-columns: 340px minmax(0, 1fr);
  align-items: stretch;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  align-items: center;
  gap: 2rem;
  overflow: hidden;
  min-height: 430px;
  padding: 2rem;
  background:
    linear-gradient(120deg, rgba(124, 60, 255, 0.25), transparent 48%),
    linear-gradient(135deg, rgba(17, 17, 29, 0.95), rgba(5, 5, 9, 0.95));
}

.hero h1 {
  margin: 0.25rem 0;
  font-size: clamp(3rem, 8vw, 6.6rem);
  line-height: 0.9;
}

.hero p {
  max-width: 720px;
  color: #d5d8e8;
  font-size: 1.08rem;
  line-height: 1.7;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem;
  margin-top: 1rem;
}

.hero-card {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(250, 204, 21, 0.25);
}

.hero-card img {
  width: min(86%, 280px);
  height: auto;
  display: block;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
}

.stat-pill {
  display: grid;
  gap: 0.2rem;
  padding: 1rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.stat-pill strong {
  color: var(--gold);
  font-size: 1.35rem;
}

.about-section {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
  gap: 1rem;
  overflow: hidden;
  padding: clamp(1.2rem, 3vw, 2rem);
  background:
    linear-gradient(135deg, rgba(13, 13, 24, 0.96), rgba(39, 20, 75, 0.78)),
    radial-gradient(circle at 80% 20%, rgba(250, 204, 21, 0.16), transparent 34%);
  border-color: rgba(250, 204, 21, 0.24);
}

.about-glow {
  position: absolute;
  inset: auto -12% -34% 40%;
  height: 260px;
  pointer-events: none;
  background: radial-gradient(circle, rgba(124, 60, 255, 0.34), transparent 66%);
  filter: blur(6px);
}

.about-copy,
.about-card-grid {
  position: relative;
  z-index: 1;
}

.about-copy {
  display: grid;
  align-content: center;
  gap: 0.85rem;
}

.about-copy h2 {
  max-width: 760px;
  margin: 0;
  font-size: clamp(2rem, 4vw, 3.65rem);
  line-height: 0.98;
}

.about-copy p {
  margin: 0;
  color: #d8dceb;
  line-height: 1.75;
  font-size: 1rem;
}

.about-card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.85rem;
}

.about-card {
  display: grid;
  gap: 0.55rem;
  min-height: 168px;
  padding: 1rem;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(124, 60, 255, 0.12)),
    rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.about-card span {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  color: var(--gold);
  background: rgba(250, 204, 21, 0.1);
  border: 1px solid rgba(250, 204, 21, 0.26);
  border-radius: 8px;
}

.about-card h3 {
  margin: 0;
}

.about-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.55;
}

.eyebrow {
  color: var(--gold);
  font-size: 0.78rem;
  font-weight: 950;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.panel-title {
  display: grid;
  gap: 0.3rem;
  padding: 1.15rem;
  border-bottom: 1px solid var(--line);
}

.panel-title.inline {
  grid-template-columns: 1fr auto;
  align-items: center;
}

.panel-title h2,
.panel-title h3 {
  margin: 0;
}

.sidebar-panel {
  display: grid;
  gap: 0.9rem;
  padding: 1rem;
}

.sidebar-panel h3 {
  margin: 0.25rem 0 0;
}

.search-box {
  position: relative;
}

.search-box svg {
  position: absolute;
  left: 0.85rem;
  top: 2.4rem;
  color: var(--muted);
}

.search-box input {
  padding-left: 2.45rem;
}

.mini-user {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.mini-user span,
.post-head span,
.thread small,
.muted {
  color: var(--muted);
}

.compact-form {
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
}

.user-card-list {
  display: grid;
  gap: 0.7rem;
  padding: 1rem;
}

.user-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.8rem;
  padding: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.045);
}

.user-card strong,
.user-card span {
  display: block;
}

.user-card span {
  color: var(--muted);
}

.profile-identity {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 0.7rem;
  min-width: 0;
  color: var(--text);
  text-align: left;
  background: transparent;
  border: 0;
  padding: 0;
}

.profile-identity span {
  display: grid;
  gap: 0.1rem;
  min-width: 0;
}

.profile-identity strong {
  color: var(--text);
}

.profile-identity small {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profile-link,
.inline-profile-link {
  cursor: pointer;
}

.profile-link:hover strong,
.inline-profile-link:hover {
  color: var(--gold);
}

.inline-profile-link {
  color: inherit;
  background: transparent;
  border: 0;
  padding: 0;
  font-weight: 900;
  text-align: left;
}

.user-card-actions,
.reference-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: flex-end;
}

.reference-actions {
  justify-content: flex-start;
  padding-top: 0.5rem;
}

.avatar {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  color: var(--gold);
  background:
    linear-gradient(135deg, rgba(124, 60, 255, 0.7), rgba(56, 189, 248, 0.28)),
    #111827;
  background-position: center;
  background-size: cover;
  border: 1px solid rgba(250, 204, 21, 0.35);
  border-radius: 50%;
  font-weight: 950;
}

.avatar.large {
  width: 110px;
  height: 110px;
  font-size: 1.6rem;
  border-width: 3px;
}

.feed-list {
  display: grid;
  gap: 0.9rem;
  padding: 1rem;
}

.composer {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 0.65rem;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid var(--line);
}

.post-card {
  display: grid;
  gap: 0.85rem;
  padding: 1rem;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.post-head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.post-head div {
  display: grid;
  gap: 0.12rem;
}

.post-card p {
  margin: 0;
  color: #e6e8f4;
  line-height: 1.55;
}

.video-frame {
  position: relative;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border: 1px solid rgba(56, 189, 248, 0.22);
  border-radius: 8px;
  background: #000;
}

.video-frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.video-frame video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  object-fit: contain;
  background: #000;
}

.post-image {
  width: 100%;
  max-height: 520px;
  object-fit: cover;
  border-radius: 8px;
}

.post-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}

.post-actions button {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.52rem 0.75rem;
}

.post-actions button.active {
  color: #fff7cc;
  border-color: rgba(250, 204, 21, 0.48);
  background: linear-gradient(135deg, rgba(124, 60, 255, 0.48), rgba(250, 204, 21, 0.16));
}

.comment-panel {
  display: grid;
  gap: 0.8rem;
  padding: 0.8rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.035);
}

.comment-list {
  display: grid;
  gap: 0.55rem;
}

.comment-item {
  padding: 0.65rem 0.75rem;
  border: 1px solid rgba(255, 255, 255, 0.075);
  border-radius: 8px;
  background: rgba(5, 5, 9, 0.46);
}

.comment-item p {
  margin: 0.25rem 0 0;
  color: #e7e9f6;
}

.comment-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.55rem;
}

.profile-card {
  overflow: hidden;
}

.profile-banner {
  position: relative;
  display: flex;
  align-items: end;
  min-height: 210px;
  padding: 1rem;
  background:
    linear-gradient(135deg, rgba(124, 60, 255, 0.5), rgba(56, 189, 248, 0.15)),
    #0b0b12;
  background-position: center;
  background-size: cover;
}

.profile-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: start;
  padding: 1.2rem;
}

.profile-head h2 {
  margin: 0.2rem 0 0.3rem;
  font-size: 2rem;
}

.profile-head p {
  margin: 0;
  color: #d7dbea;
  line-height: 1.65;
}

.edit-profile-grid,
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.9rem;
  padding: 1.15rem;
}

.form-grid {
  grid-template-columns: 1fr;
}

.wide {
  grid-column: 1 / -1;
}

.file-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 46px;
  padding: 0.72rem 1rem;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px dashed rgba(56, 189, 248, 0.38);
  border-radius: 8px;
  cursor: pointer;
}

.file-button input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  opacity: 0;
}

.profile-save-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
}

.status-text {
  margin: 0.8rem 1.15rem 1.15rem;
  color: var(--gold);
  font-weight: 800;
}

.status-text.success {
  color: var(--green);
}

.empty-state {
  margin: 0;
  padding: 1rem;
  color: var(--muted);
}

.room-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding: 1rem 1rem 0;
}

.room-tabs button {
  border-color: color-mix(in srgb, var(--room-color) 55%, transparent);
}

.chat-window,
.dm-window {
  display: grid;
  gap: 0.75rem;
  min-height: 420px;
  max-height: 58vh;
  overflow: auto;
  padding: 1rem;
}

.chat-line {
  display: flex;
  gap: 0.75rem;
  align-items: start;
}

.chat-line div {
  padding: 0.7rem 0.85rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.chat-line p {
  margin: 0.2rem 0 0;
  color: #e7e9f6;
}

.message-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.65rem;
  padding: 1rem;
  border-top: 1px solid var(--line);
}

.media-message-form {
  grid-template-columns: minmax(0, 1fr) auto auto;
}

.attach-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 0.9rem;
  color: #f7ebc0;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(124, 60, 255, 0.18);
  border: 1px solid rgba(250, 204, 21, 0.3);
  border-radius: 8px;
  cursor: pointer;
}

.attach-button input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  opacity: 0;
}

.message-media {
  margin: 0.55rem 0 0;
}

.message-media img,
.message-media video {
  display: block;
  width: min(320px, 100%);
  max-height: 280px;
  object-fit: contain;
  background: #030307;
  border: 1px solid rgba(250, 204, 21, 0.24);
  border-radius: 8px;
}

.message-attachment {
  display: inline-flex;
  margin-top: 0.55rem;
  color: var(--gold);
  font-weight: 900;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.9rem;
  padding: 1rem;
}

.room-card {
  display: grid;
  gap: 0.7rem;
  padding: 1rem;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.room-card h3,
.room-card p {
  margin: 0;
}

.live-room-card {
  grid-template-columns: minmax(0, 1fr);
}

.live-room-card span {
  display: block;
  margin-top: 0.25rem;
  color: var(--muted);
  font-size: 0.82rem;
}

.room-card svg {
  color: var(--gold);
}

.video-post-panel,
.auth-card {
  width: min(620px, 100%);
  margin: 0 auto;
}

.video-post-layout {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  width: min(1180px, 100%);
  margin: 0 auto;
}

.live-panel {
  overflow: hidden;
}

.call-room-label {
  display: grid;
  gap: 0.45rem;
  margin: 1rem;
  color: #f7ebc0;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.live-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  padding: 0 1rem;
}

.live-grid.trio {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.live-stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 360px;
  overflow: hidden;
  color: #dce3f6;
  background:
    linear-gradient(135deg, rgba(124, 60, 255, 0.24), transparent),
    #030307;
  border: 1px solid rgba(56, 189, 248, 0.18);
  border-radius: 8px;
}

.live-stage video {
  width: 100%;
  height: 100%;
  min-height: 360px;
  object-fit: cover;
}

.video-name {
  position: absolute;
  left: 0.75rem;
  bottom: 0.75rem;
  max-width: calc(100% - 1.5rem);
  padding: 0.35rem 0.55rem;
  overflow: hidden;
  color: #fff7d1;
  font-size: 0.78rem;
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: rgba(3, 3, 7, 0.78);
  border: 1px solid rgba(250, 204, 21, 0.28);
  border-radius: 999px;
}

.remote-stage {
  border-color: rgba(56, 189, 248, 0.32);
}

.live-stage div {
  display: grid;
  place-items: center;
  gap: 0.5rem;
  text-align: center;
  padding: 1.5rem;
}

.live-stage svg {
  color: var(--purple);
}

.call-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem;
  padding: 1rem;
}

.live-now-strip {
  display: grid;
  gap: 0.85rem;
  margin: 1rem;
  padding: 1rem;
  background: rgba(124, 60, 255, 0.08);
  border: 1px solid rgba(250, 204, 21, 0.16);
  border-radius: 8px;
}

.inbox-layout .panel {
  min-height: 640px;
}

.thread-list {
  display: grid;
  align-content: start;
}

.thread {
  justify-content: start;
  width: calc(100% - 2rem);
  margin: 0.3rem 1rem;
  padding: 0.7rem;
  text-align: left;
}

.thread .profile-identity {
  flex: 1 1 auto;
}

.thread .ghost-action {
  margin-left: auto;
}

.thread span {
  display: grid;
  gap: 0.15rem;
  min-width: 0;
}

.thread small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dm-panel {
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.bubble {
  justify-self: start;
  max-width: min(76%, 620px);
  margin: 0;
  padding: 0.75rem 0.95rem;
  color: #eaf0ff;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.bubble.mine {
  justify-self: end;
  color: #09090f;
  background: linear-gradient(135deg, var(--gold), #fde68a);
}

.bubble p {
  margin: 0;
}

.bubble.mine .message-media img,
.bubble.mine .message-media video {
  border-color: rgba(10, 10, 15, 0.24);
}

.segmented {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
  padding: 1rem 1rem 0;
}

.oauth-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  padding: 0 1.15rem 1.15rem;
}

.oauth-row.social-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.oauth-row.social-grid button {
  justify-content: flex-start;
  min-width: 0;
  white-space: normal;
  text-align: left;
}

.remember-row {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  color: var(--muted);
  font-weight: 800;
}

.remember-row input {
  width: 18px;
  height: 18px;
  accent-color: var(--gold);
}

.auth-hint {
  color: var(--muted);
  line-height: 1.5;
}

.verification-card {
  display: grid;
  gap: 0.55rem;
  margin: 0 1.15rem 1.15rem;
  padding: 0.9rem;
  border: 1px solid rgba(250, 204, 21, 0.28);
  border-radius: 8px;
  background: rgba(250, 204, 21, 0.08);
  box-shadow: 0 0 24px rgba(109, 40, 217, 0.14);
}

.verification-card span {
  color: var(--muted);
  line-height: 1.45;
}

.verification-card .ghost-action {
  justify-self: start;
}

.post-complete {
  display: grid;
  place-items: center;
  gap: 0.7rem;
  min-height: 280px;
  padding: 2rem 1rem;
  text-align: center;
}

.post-complete svg {
  color: var(--gold);
}

.post-complete h3,
.post-complete p {
  margin: 0;
}

.post-complete p {
  max-width: 520px;
  color: var(--muted);
  line-height: 1.6;
}

.posted-video-only {
  display: grid;
  gap: 1rem;
  padding: 1rem;
}

@media (max-width: 1040px) {
  .topbar {
    grid-template-columns: 1fr auto;
  }

  .topbar nav {
    grid-column: 1 / -1;
    order: 3;
  }

  .top-search {
    grid-column: 1 / -1;
    order: 4;
  }

  .content-layout,
  .inbox-layout,
  .live-grid,
  .live-grid.trio,
  .video-post-layout,
  .about-section,
  .hero {
    grid-template-columns: 1fr;
  }

  .hero-card {
    max-width: 320px;
  }

  .merch-banner {
    aspect-ratio: 16 / 6;
    min-height: 140px;
    max-height: 260px;
  }
}

@media (max-width: 720px) {
  .app-shell {
    padding: 11.6rem 0.75rem 1rem;
  }

  .topbar {
    padding: 0.6rem 0.7rem;
  }

  .brand span {
    display: none;
  }

  .account-tools .ghost-action {
    display: none;
  }

  .top-search {
    grid-template-columns: 1fr;
  }

  .top-search button {
    width: 100%;
  }

  .compact-form,
  .user-card {
    grid-template-columns: 1fr;
  }

  .user-card-actions {
    justify-content: flex-start;
  }

  .hero,
  .panel-title,
  .feed-list,
  .edit-profile-grid,
  .form-grid,
  .profile-head,
  .card-grid {
    padding: 0.9rem;
  }

  .hero h1 {
    font-size: 3.4rem;
  }

  .kanji-rain span {
    font-size: 3.2rem;
  }

  .kanji-rain span.word {
    font-size: 1.75rem;
  }

  .merch-banner {
    aspect-ratio: 16 / 7;
    min-height: 128px;
    max-height: 220px;
    padding: 0.65rem;
  }

  .merch-copy small {
    font-size: 0.86rem;
  }

  .hoodie-card {
    width: 58px;
    height: 72px;
  }

  .hoodie-card::before,
  .hoodie-card::after {
    top: 20px;
    width: 20px;
    height: 46px;
  }

  .hoodie-card::before {
    left: -15px;
  }

  .hoodie-card::after {
    right: -15px;
  }

  .hoodie-two {
    width: 70px;
    height: 86px;
  }

  .stats-row,
  .edit-profile-grid,
  .card-grid,
  .about-card-grid,
  .oauth-row {
